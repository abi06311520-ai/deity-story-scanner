services:
  - type: web
    name: deity-story-scanner
    runtime: python
    plan: free
    rootDir: deity-story-scanner-src
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
